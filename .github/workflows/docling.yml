name: Docling runtime

# Runs the PDF/image tests the main CI job must skip: they need the pinned Docling environment
# (about 1.8 GB) and model assets (about 380 MB), so this workflow caches both. It runs nightly, on
# demand, and on pull requests that touch the extraction code or this workflow.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/extraction/**"
      - "tools/intake/cohort_runtime.py"
      - "tests/test_pdf_*.py"
      - "tests/pdf_fixtures.py"
      - ".github/workflows/docling.yml"
      - ".github/scripts/provision-docling.sh"
      - ".github/scripts/run_tests.py"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  docling:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: tools/context-mcp/pyproject.toml
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install ./tools/context-mcp
      - name: Allow unprivileged user and PID namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Cache the Docling runtime
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/extraction/.local
          key: docling-${{ runner.os }}-${{ hashFiles('tools/extraction/requirements-docling.txt', '.github/scripts/provision-docling.sh') }}
      - name: Provision the pinned runtime and models
        run: .github/scripts/provision-docling.sh
      - name: PDF and image tests (pinned runtime, nothing may skip)
        shell: bash
        run: |
          .venv/bin/python -W error::ResourceWarning -X dev .github/scripts/run_tests.py \
            --pattern 'test_pdf_*.py'
      - name: Real worker tests (nothing may skip)
        # These need pypdfium2, so they run under the Docling interpreter.
        shell: bash
        env:
          DOCLING_REAL_TESTS: "1"
          DOCLING_ARTIFACTS_PATH: ${{ github.workspace }}/tools/extraction/.local/models
        run: |
          tools/extraction/.local/venv-docling/bin/python -W error::ResourceWarning \
            .github/scripts/run_tests.py --start tools/extraction --pattern 'test_docling_worker.py'
