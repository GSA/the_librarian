name: LibreOffice runtime

# Runs the legacy Office (.doc/.xls/.ppt/.vsd) tests the main CI job must skip: they need the pinned
# LibreOffice runtime (about 220 MB download, 415 MB unpacked), provisioned the way a teammate does it,
# in user space with no root: tools/extraction/provision_libreoffice.py. It runs nightly, on demand, and
# on pull requests that touch the converter, its sandbox or this workflow.
on:
  schedule:
    - cron: "29 5 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/extraction/convert.py"
      - "tools/extraction/convert_worker.py"
      - "tools/extraction/bounded.py"
      - "tools/extraction/office_runtime.py"
      - "tools/extraction/provision_libreoffice.py"
      - "tests/test_office_runtime.py"
      - "tests/test_convert.py"
      - ".github/workflows/libreoffice.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  libreoffice:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: tools/context-mcp/pyproject.toml
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install ./tools/context-mcp
      - name: Install bubblewrap
        run: command -v bwrap || sudo apt-get install -y --no-install-recommends bubblewrap
      - name: Allow unprivileged user and PID namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || echo "sysctl not present on this image; namespaces are checked by the skip allowlist"
      - name: Cache the LibreOffice runtime
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/extraction/.local/libreoffice
          key: libreoffice-${{ runner.os }}-${{ hashFiles('tools/extraction/provision_libreoffice.py') }}
      - name: Provision the pinned runtime (no root) and verify it in the sandbox
        run: |
          if [ ! -x tools/extraction/.local/libreoffice/current/program/soffice ]; then
            .venv/bin/python -m tools.extraction.provision_libreoffice install
          else
            .venv/bin/python -m tools.extraction.provision_libreoffice verify
          fi
      - name: Legacy conversion tests (pinned runtime, nothing may skip)
        shell: bash
        run: |
          .venv/bin/python -W error::ResourceWarning -X dev .github/scripts/run_tests.py --pattern 'test_office_runtime.py'
          .venv/bin/python -W error::ResourceWarning -X dev .github/scripts/run_tests.py --pattern 'test_convert.py'
