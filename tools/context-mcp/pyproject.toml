[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "the-librarian-mcp"
version = "0.3.0"
description = "The Librarian's local read-only MCP adapter for qualified context"
readme = "README.md"
license = "CC0-1.0"
license-files = ["LICENSE.md"]
requires-python = ">=3.14"
dependencies = [
    "mcp==2.2.0",
    "anyio>=4.10,<5",
    "jsonschema>=4.20,<5",
]

[project.scripts]
librarian-mcp = "the_librarian_mcp.server:main"
librarian-preflight = "the_librarian_mcp.preflight:main"
librarian-audit = "the_librarian_mcp.audit:main"

[tool.setuptools.packages.find]
where = ["src"]
