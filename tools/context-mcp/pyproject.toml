[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "the-librarian-mcp"
version = "0.3.0"
description = "The Librarian's local read-only MCP adapter for qualified context"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp==2.2.0",
    "anyio>=4.5,<5",
    "jsonschema>=4.19.2,<5",
]

[project.scripts]
librarian-mcp = "the_librarian_mcp.server:main"
librarian-preflight = "the_librarian_mcp.preflight:main"

[tool.setuptools.packages.find]
where = ["src"]
